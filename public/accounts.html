<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accounts | Streaming Manager</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body data-page="accounts">
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-main">
          <div class="brand">Streaming Manager</div>
          <button id="navToggle" class="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primaryNav">
            <span class="menu-icon"><span></span><span></span><span></span></span>
          </button>
          <nav class="nav" id="primaryNav">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/accounts.html" class="active">Accounts</a>
            <a href="/profiles.html">Profiles</a>
            <a href="/payments.html">Payments</a>
          </nav>
        </div>
        <div class="topbar-actions">
          <button id="logoutButton" class="danger">Logout</button>
        </div>
      </header>

      <section class="page-hero">
        <div class="hero-card">
          <h1 class="hero-title">Accounts stay organized and full at a glance.</h1>
          <p class="hero-text">Store each streaming account once, then attach up to four customer profiles to keep allocation simple.</p>
        </div>
      </section>

      <section class="panel">
        <h2>Add or Update Streaming Account</h2>
        <form id="accountForm" class="form-grid">
          <input id="accountId" type="hidden" />

          <div>
            <label for="accountEmail">Account Email</label>
            <input id="accountEmail" type="email" required />
          </div>

          <div>
            <label for="accountPassword">Account Password</label>
            <input id="accountPassword" type="text" required />
          </div>

          <div class="actions-row" style="grid-column: 1 / -1">
            <button id="accountSubmit" type="submit">Save Account</button>
          </div>
        </form>
        <div id="accountsMessage" class="message"></div>
      </section>

      <section class="panel">
        <h2>Accounts List</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Email</th>
                <th>Status</th>
                <th>Profiles</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="accountsTableBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/main.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Streaming Manager</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body data-page="login" class="login-page">
    <div class="login-card">
      <div class="login-badge">Streaming subscription admin</div>
      <h1 class="login-title">Streaming Admin Login</h1>
      <p class="login-subtitle">Manage accounts, profiles, and monthly payments.</p>

      <form id="loginForm">
        <div>
          <label for="username">Username</label>
          <input id="username" name="username" type="text" required />
        </div>

        <div style="margin-top: 12px">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required />
        </div>

        <div class="actions-row login-actions">
          <button type="submit">Login</button>
        </div>

        <div id="loginMessage" class="message"></div>
      </form>

      <div id="loginSuccess" class="login-success" aria-hidden="true">
        <div class="login-success-mark" aria-hidden="true"><span></span></div>
        <div class="login-success-title">Access granted</div>
        <div class="login-success-text">Opening your dashboard now.</div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/main.js"></script>
  </body>
</html>

[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  external_node_modules = ["bcrypt", "pg", "express", "connect-pg-simple", "express-session", "helmet", "express-rate-limit", "dotenv", "serverless-http"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
